<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>circuit-agents · Live Console</title>
<style>
:root {
  --bg: #0d1117;
  --panel: #161b22;
  --border: #30363d;
  --ink: #e6edf3;
  --muted: #8b949e;
  --green: #2e7d32; --red: #c62828; --orange: #ef6c00;
  --purple: #9c27b0; --blue: #58a6ff; --teal: #39d353;
  --radius: 8px; --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font); background: var(--bg); color: var(--ink);
  display: flex; flex-direction: column;
}

/* ── Header ── */
header {
  padding: 10px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  background: var(--panel);
}
header h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }
header .stat { font-size: 12px; color: var(--muted); margin-left: auto; }
header .model-badge { font-size: 12px; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
  display: inline-flex; align-items: center; }
header .model-badge.live { color: var(--teal); border-color: var(--teal); }
header .model-badge.pulsing { animation: badgePulse 1.2s ease-in-out infinite; }
@keyframes badgePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

/* ── Layout ── */
main { flex: 1; display: grid; grid-template-columns: 380px 1fr; overflow: hidden; }

/* ── Left Panel ── */
.left {
  background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.left-section { padding: 16px; border-bottom: 1px solid var(--border); }
.left-section h2 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
  color: var(--muted); margin-bottom: 10px; font-weight: 600;
}
#goalInput {
  width: 100%; height: 120px; resize: vertical; font-family: var(--mono);
  font-size: 13px; padding: 10px; border-radius: var(--radius);
  background: var(--bg); color: var(--ink); border: 1px solid var(--border);
  outline: none; transition: border-color 150ms var(--ease);
}
#goalInput:focus { border-color: var(--blue); }
.opt-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.opt-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
.opt-input {
  width: 64px; font-family: var(--mono); font-size: 13px; padding: 5px 8px;
  border-radius: var(--radius); background: var(--bg); color: var(--ink);
  border: 1px solid var(--border); outline: none; transition: border-color 150ms var(--ease);
}
.opt-input:focus { border-color: var(--blue); }
.opt-hint { font-size: 11px; color: var(--muted); opacity: 0.7; }
.btn-row { display: flex; gap: 8px; margin-top: 10px; }
.btn {
  padding: 8px 18px; border-radius: var(--radius); border: 1px solid var(--border);
  font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font);
  transition: transform 120ms var(--ease), background 150ms var(--ease);
  display: flex; align-items: center; gap: 6px;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: #238636; color: #fff; border-color: #238636; }
.btn-primary:hover { background: #2ea043; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-ghost { background: transparent; color: var(--ink); }
.btn-ghost:hover { background: rgba(255,255,255,0.05); }
.btn-sm { padding: 5px 12px; font-size: 12px; }

/* ── History ── */
.history-list { flex: 1; overflow-y: auto; padding: 8px 0; }
.history-item {
  padding: 10px 16px; cursor: pointer; border-left: 3px solid transparent;
  transition: background 120ms var(--ease), border-color 150ms var(--ease);
  font-size: 13px; line-height: 1.4;
}
.history-item:hover { background: rgba(255,255,255,0.03); }
.history-item.selected { border-left-color: var(--blue); background: rgba(88,166,255,0.06); }
.history-item .hi-goal {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px;
}
.history-item .hi-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
.hi-status { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 10px; font-weight: 600; }
.hi-status.done { background: #122d17; color: var(--teal); }
.hi-status.running { background: #1a2332; color: var(--blue); }
.hi-status.error { background: #2d1216; color: var(--red); }

/* ── Right Panel ── */
.right { display: flex; flex-direction: column; overflow: hidden; }

/* Topology */
.topo-area {
  flex: 0 0 45%; border-bottom: 1px solid var(--border);
  position: relative; overflow: hidden;
  background: radial-gradient(ellipse at 50% 50%, #161b22 0%, var(--bg) 100%);
}
.topo-area svg { width: 100%; height: 100%; display: block; }

/* Bottom: Timeline + Output + Result */
.bottom { flex: 1; display: grid; grid-template-rows: 1.05fr 1fr auto; overflow: hidden; }
.timeline {
  overflow-y: auto; padding: 12px 16px; font-size: 12px; font-family: var(--mono);
  line-height: 1.7; counter-reset: tline;
}
.tml-ev {
  padding: 4px 8px; border-left: 2px solid var(--border); margin-bottom: 4px;
  opacity: 0; animation: tmlIn 200ms var(--ease) forwards;
  animation-delay: calc(var(--i) * 40ms);
  border-radius: 0 4px 4px 0;
}
@keyframes tmlIn { to { opacity: 1; } }
.tml-ev.node_done { border-left-color: var(--green); background: rgba(46,125,50,0.05); }
.tml-ev.gate_fail { border-left-color: var(--red); background: rgba(198,40,40,0.05); }
.tml-ev.retry { border-left-color: var(--orange); background: rgba(239,108,0,0.05); }
.tml-ev.evolve { border-left-color: var(--purple); background: rgba(156,39,176,0.05); }
.tml-ev .tml-node { color: var(--blue); font-weight: 600; }
.tml-ev .tml-time { color: var(--muted); }
.tml-ev .tml-ok { color: var(--teal); }
.tml-ev .tml-fail { color: var(--red); }
.result-bar {
  padding: 14px 20px; border-top: 1px solid var(--border);
  display: flex; gap: 24px; align-items: center; flex-wrap: wrap;
  background: var(--panel); flex-shrink: 0;
}
.result-bar .r-item { font-size: 13px; }
.result-bar .r-label { font-size: 11px; color: var(--muted); display: block; }
.result-bar .r-value { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
.r-quality { color: var(--teal); }
.r-cost { color: var(--blue); }
.r-nodes { color: var(--muted); }

/* ── 任务输出面板 ── */
.output-panel {
  display: flex; flex-direction: column; overflow: hidden;
  border-top: 1px solid var(--border); background: var(--panel);
}
.op-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.op-head > span { font-size: 12px; font-weight: 600; color: var(--ink);
  text-transform: uppercase; letter-spacing: 0.6px; }
.op-body { flex: 1; overflow-y: auto; padding: 8px 16px; font-family: var(--mono);
  font-size: 12px; line-height: 1.6; }
.op-body .empty-state { padding: 24px 0; }
.out-node {
  padding: 7px 10px; margin-bottom: 6px; border-radius: var(--radius);
  background: var(--bg); border: 1px solid var(--border);
  border-left: 2px solid var(--blue);
}
.out-node.out-final {
  border-left-color: var(--teal); background: rgba(57,211,83,0.06);
}
.out-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.out-name { color: var(--blue); font-weight: 600; font-size: 13px; }
.out-type { color: var(--muted); font-size: 11px;
  background: rgba(255,255,255,0.05); padding: 1px 7px; border-radius: 8px; }
.out-badge { margin-left: auto; font-size: 10px; font-weight: 600; color: var(--teal);
  background: rgba(57,211,83,0.12); padding: 1px 8px; border-radius: 8px; }
.out-val { color: var(--ink); white-space: pre-wrap; word-break: break-word; opacity: 0.92; }

/* ── Empty state ── */
.empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; color: var(--muted); gap: 8px;
}
.empty-state .icon { font-size: 48px; opacity: 0.3; }

/* ── Spinner ── */
.spinner {
  display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border);
  border-top-color: var(--blue); border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 简易/完整模式：简易模式隐藏高级控件（.adv） */
body.simple-mode .adv { display: none !important; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── SVG topology ── */
.topo-node { cursor: pointer; transition: transform 150ms var(--ease); }
.topo-node:hover { transform: scale(1.05); }
.topo-node rect { transition: stroke 200ms var(--ease), fill 200ms var(--ease); }
.topo-wire { stroke: var(--border); stroke-width: 2; transition: stroke 200ms var(--ease); }
.topo-wire.active { stroke: var(--blue); stroke-width: 3; }
.topo-label { fill: var(--ink); font-size: 11px; font-family: var(--font); text-anchor: middle; }
.topo-type { fill: var(--muted); font-size: 9px; font-family: var(--font); text-anchor: middle; }
.topo-badge { font-size: 14px; font-weight: 700; }

/* ── ⑥ 批量执行面板 ── */
.batch-results { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.batch-summary { font-size: 12px; padding: 8px 10px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--border); line-height: 1.6; }
.batch-summary b { color: var(--ink); }
.batch-card { font-size: 12px; padding: 8px 10px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--border); line-height: 1.5; }
.batch-card .bc-head { display: flex; justify-content: space-between; gap: 8px; }
.batch-card .bc-id { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.batch-card .bc-ok { color: var(--green); }
.batch-card .bc-err { color: var(--red); }
.batch-card .bc-q { color: var(--blue); font-weight: 600; }
.batch-tag { display:inline-block; font-size:10px; padding:1px 6px; border-radius:6px;
  background: var(--surface-3); color: var(--muted); margin-left:6px; }
</style>
</head>
<body>

<header>
  <div class="dot" id="statusDot"></div>
  <h1>circuit-agents · Live Console</h1>
  <button id="modeToggle" class="btn btn-sm btn-ghost" onclick="toggleMode()" title="切换简易 / 完整模式">模式: 简易</button>
  <span class="model-badge" id="modelBadge">🧠 模型：检测中…</span>
  <span class="stat" id="connStat">已连接</span>
</header>

<main>
  <!-- ── Left Panel ── -->
  <div class="left">
    <div class="left-section">
      <h2>✦ 想让我帮你做什么？</h2>
      <textarea id="goalInput" placeholder="用大白话告诉我你想做什么，例如：
把这份销售表按地区汇总，算出每个地区的环比增长，挑出下滑最多的三个"></textarea>
      <div class="opt-row adv">
        <label class="opt-label" for="qThreshold">质量门阈值</label>
        <input id="qThreshold" class="opt-input" type="number" min="0" max="1" step="0.05" value="0.8"
               title="ADC/verify 节点的达标阈值，默认 0.8。越低越易通过。" />
        <span class="opt-hint">0~1，越低越易通过</span>
      </div>
      <div class="opt-row adv">
        <label class="opt-label" for="attInput">附件路径</label>
        <input id="attInput" class="opt-input" type="text" style="flex:1;min-width:0;"
               placeholder="图片/语音路径，逗号分隔（如 a.png,b.wav）" />
        <span class="opt-hint">按扩展名分图/音</span>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnRun" onclick="submitGoal()">
          <span id="btnRunLabel">开始</span>
        </button>
        <button class="btn btn-ghost" onclick="clearAll()">清空</button>
      </div>
    </div>

    <!-- ⑥ 多任务并行 -->
    <div class="left-section adv">
      <h2>⚡ 批量执行 <span class="opt-hint">⑥ 多任务并行</span></h2>
      <textarea id="batchInput" placeholder="每行一个任务，并发执行并统一汇聚：
分析第一季度销售额
总结本月用户反馈
对比两个竞品定价策略"></textarea>
      <div class="opt-row">
        <label class="opt-label" for="batchWorkers">并发数</label>
        <input id="batchWorkers" class="opt-input" type="number" min="1" max="16" step="1" value="4"
               title="并发线程数上限，默认 4" style="width:72px;" />
        <span class="opt-hint">默认 min(任务数, 8)</span>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnBatch" onclick="submitBatch()">
          <span id="btnBatchLabel">批量执行</span>
        </button>
      </div>
      <div id="batchResults" class="batch-results"></div>
    </div>

    <div class="left-section" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
      <h2 style="display:flex;justify-content:space-between;">
        ⏱ 历史
        <button class="btn btn-sm btn-ghost" onclick="refreshHistory()">刷新</button>
      </h2>
      <div class="history-list" id="historyList">
        <div class="empty-state" style="padding:30px 0;">
          <div class="icon">⚡</div>
          <div style="font-size:13px;">提交一个任务开始</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Right Panel ── -->
  <div class="right">
    <div class="topo-area" id="topoArea">
      <svg id="topoSvg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet">
        <text x="400" y="200" text-anchor="middle" fill="var(--muted)" font-size="14" opacity="0.5">
          等待任务提交...
        </text>
      </svg>
    </div>

    <div class="bottom">
      <div class="timeline" id="timeline">
        <div class="empty-state">
          <div class="icon" style="font-size:36px;">📡</div>
          <div style="font-size:13px;">实时执行事件将在此展示</div>
        </div>
      </div>
      <div class="output-panel" id="outputPanel">
        <div class="op-head">
          <span>📤 任务输出</span>
          <button class="btn btn-sm btn-ghost" onclick="copyOutput()">复制</button>
        </div>
        <div class="op-body" id="outputBody">
          <div class="empty-state"><div class="icon" style="font-size:32px;">📭</div><div style="font-size:13px;">节点产出将在此显示</div></div>
        </div>
      </div>
      <div class="result-bar" id="resultBar" style="opacity:0;">
        <div class="r-item">
          <span class="r-label">最终品质</span>
          <span class="r-value r-quality" id="rQuality">--</span>
        </div>
        <div class="r-item">
          <span class="r-label">总成本</span>
          <span class="r-value r-cost" id="rCost">--</span>
        </div>
        <div class="r-item">
          <span class="r-label">节点数</span>
          <span class="r-value r-nodes" id="rNodes">--</span>
        </div>
        <div class="r-item">
          <span class="r-label">总延迟</span>
          <span class="r-value r-cost" id="rLatency">--</span>
        </div>
        <div class="r-item">
          <span class="r-label">质量门</span>
          <span class="r-value" id="rGate">--</span>
        </div>
        <div class="r-item" id="rStatus" style="flex-basis:100%;font-size:12px;line-height:1.5;"></div>
      </div>
    </div>
  </div>
</main>

<script>
// ────────────────────────────────────────────────────
// State
// ────────────────────────────────────────────────────
const API = '';
let currentRunId = null;
let currentSpec = null;
let eventSource = null;
let t0 = null;
let nodeOutputs = {};   // node -> 真实产出值（来自 node_done 事件的 value）
let nodeOrder = [];     // 节点完成顺序（保证输出面板按执行序排列）

// ────────────────────────────────────────────────────
// API calls
// ────────────────────────────────────────────────────

async function submitGoal() {
  const goal = document.getElementById('goalInput').value.trim();
  if (!goal) return;

  const btn = document.getElementById('btnRun');
  const label = document.getElementById('btnRunLabel');
  btn.disabled = true;
  label.textContent = '提交中...';

  try {
    const res = await fetch(API + '/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        goal, route: true, evolve_enabled: false, memory_enabled: false,
        quality_threshold: (() => {
          const v = parseFloat(document.getElementById('qThreshold').value);
          return isNaN(v) ? null : v;
        })(),
        ...((() => {
          const raw = document.getElementById('attInput').value.trim();
          if (!raw) return {};
          const IMG = /\.(png|jpe?g|gif|bmp|webp|svg)$/i;
          const AUD = /\.(wav|mp3|m4a|ogg|flac|aac)$/i;
          const imgs = [], auds = [];
          raw.split(',').map(s => s.trim()).filter(Boolean).forEach(p => {
            if (AUD.test(p)) auds.push(p); else imgs.push(p);
          });
          const out = {};
          if (imgs.length) out.images = imgs;
          if (auds.length) out.audio = auds;
          return out;
        })())
      })
    });
    const data = await res.json();
    currentRunId = data.run_id;
    // 清空旧数据
    resetDisplay();
    // 开始 SSE
    connectStream(currentRunId);
    // 刷新历史
    refreshHistory();
    // 更新按钮
    label.innerHTML = '<span class="spinner"></span> 执行中';
  } catch (e) {
    console.error(e);
    label.textContent = '错误，重试';
    btn.disabled = false;
  }
}

// ────────────────────────────────────────────────────
// ⑥ 批量执行
// ────────────────────────────────────────────────────
async function submitBatch() {
  const raw = document.getElementById('batchInput').value.trim();
  if (!raw) return;
  const goals = raw.split('\n').map(s => s.trim()).filter(Boolean);
  if (!goals.length) return;

  const btn = document.getElementById('btnBatch');
  const label = document.getElementById('btnBatchLabel');
  btn.disabled = true;
  label.innerHTML = '<span class="spinner"></span> 执行中…';
  document.getElementById('batchResults').innerHTML = '';

  const workers = parseInt(document.getElementById('batchWorkers').value, 10);
  try {
    const res = await fetch(API + '/batch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        goals,
        max_workers: isNaN(workers) ? null : workers,
        route: true, evolve_enabled: false, memory_enabled: false,
      })
    });
    const agg = await res.json();
    renderBatch(agg);
  } catch (e) {
    console.error(e);
    document.getElementById('batchResults').innerHTML =
      `<div class="batch-card bc-err">批量执行失败：${esc(e.message || e)}</div>`;
  } finally {
    label.textContent = '批量执行';
    btn.disabled = false;
  }
}

function renderBatch(agg) {
  const box = document.getElementById('batchResults');
  const okN = agg.succeeded, failN = agg.failed, tot = agg.total;
  let html = `<div class="batch-summary">
    <b>⑥ 批量完成</b>：共 ${tot} 项 · 成功 <b style="color:var(--green)">${okN}</b>
    · 失败 <b style="color:var(--red)">${failN}</b>
    <span class="batch-tag">并行 ${agg.parallel ? '是' : '否'}</span>
    <span class="batch-tag">${agg.max_workers} 线程</span><br/>
    墙钟 <b>${agg.wall_time_ms}ms</b> · 串行估算 <b>${agg.sequential_est_ms}ms</b>
    · 加速比 <b>${agg.speedup ?? '—'}</b>
    · 聚合质量 <b class="bc-q">${agg.aggregate_final_quality}</b>
    · 聚合成本 <b>${agg.aggregate_cost}</b>
  </div>`;
  for (const gid of Object.keys(agg.results || {})) {
    const r = agg.results[gid];
    const ok = r.status === 'done';
    const q = ok ? r.result.final_quality : null;
    const cost = ok ? r.result.total_cost : null;
    const goalTxt = esc(r.goal || '').slice(0, 60);
    html += `<div class="batch-card">
      <div class="bc-head">
        <span class="bc-id">${esc(gid)}</span>
        <span class="${ok ? 'bc-ok' : 'bc-err'}">${ok ? '✓ 成功' : '✗ ' + esc(r.error || '失败')}</span>
      </div>
      <div>${goalTxt}${goalTxt.length >= 60 ? '…' : ''}</div>
      ${ok ? `<div>质量 <span class="bc-q">${q}</span> · 成本 ${cost} · 节点 ${Object.keys(r.result.components || {}).length}</div>` : ''}
    </div>`;
  }
  box.innerHTML = html;
}

function connectStream(runId) {
  if (eventSource) eventSource.close();
  eventSource = new EventSource(API + '/run/' + runId + '/stream');
  t0 = Date.now();

  eventSource.onmessage = (e) => {
    const data = JSON.parse(e.data);

    if (data.type === 'node_done') {
      onNodeDone(data.event);
    } else if (data.type === 'result') {
      onResult(data.result);
    } else if (data.type === 'error') {
      onError(data.error);
    }
  };

  eventSource.onerror = () => {
    // SSE done or error — poll for result
    setTimeout(() => {
      if (currentRunId) pollResult(currentRunId);
    }, 1000);
  };

  // 加载 spec 信息
  loadSpec(runId);
}

async function loadSpec(runId) {
  try {
    const res = await fetch(API + '/run/' + runId);
    const data = await res.json();
    // Poll until spec is available
    if (data.spec && Object.keys(data.spec).length > 0) {
      currentSpec = data.spec;
      renderTopology(currentSpec);
    }
  } catch (e) { /* ignore */ }
  // Keep polling for spec until we get it
  if (!currentSpec) {
    setTimeout(() => loadSpec(runId), 500);
  }
}

async function pollResult(runId) {
  try {
    const res = await fetch(API + '/run/' + runId);
    const data = await res.json();
    if (data.status === 'done' && data.result) {
      if (!currentSpec && data.spec) {
        currentSpec = data.spec;
        renderTopology(currentSpec);
      }
      onResult(data.result);
      if (eventSource) eventSource.close();
    } else if (data.status === 'error') {
      onError(data.error);
      if (eventSource) eventSource.close();
    }
  } catch (e) { /* ignore */ }
}

async function refreshHistory() {
  try {
    const res = await fetch(API + '/api/history?limit=30');
    const items = await res.json();
    renderHistory(items);
  } catch (e) {
    // No /api/history yet, try execution_store
    try {
      const res = await fetch(API + '/api/store/list?limit=30');
      const items = await res.json();
      renderHistory(items);
    } catch (e2) { /* silence */ }
  }
}

async function loadRun(runId) {
  currentRunId = runId;
  resetDisplay();
  if (eventSource) eventSource.close();

  try {
    const res = await fetch(API + '/run/' + runId);
    const data = await res.json();
    currentSpec = data.spec || {};
    if (currentSpec.components) renderTopology(currentSpec);

    if (data.status === 'done' && data.result) {
      // Replay the events visually
      const events = data.events || [];
      for (let i = 0; i < events.length; i++) {
        const ev = events[i];
        if (ev.type === 'node_done' || ev.type === 'node_done') {
          onNodeDone(ev.event || ev, true);
        }
      }
      onResult(data.result);
    } else if (data.status === 'running') {
      connectStream(runId);
    }
  } catch (e) { console.error(e); }
}

// ────────────────────────────────────────────────────
// Display handlers
// ────────────────────────────────────────────────────

function resetDisplay() {
  document.getElementById('timeline').innerHTML = '';
  nodeOutputs = {}; nodeOrder = [];
  document.getElementById('outputBody').innerHTML =
    '<div class="empty-state"><div class="icon" style="font-size:32px;">📭</div><div style="font-size:13px;">节点产出将在此显示</div></div>';
  document.getElementById('resultBar').style.opacity = '0';
  document.getElementById('topoSvg').innerHTML =
    '<text x="400" y="200" text-anchor="middle" fill="var(--muted)" font-size="14" opacity="0.5">执行中...</text>';
  document.getElementById('btnRun').disabled = true;
  document.getElementById('btnRunLabel').innerHTML = '<span class="spinner"></span> 执行中';
  setConnStatus('running');
}

function onNodeDone(info, isReplay) {
  const node = info.node || '?';
  const ok = info.ok !== false;
  const quality = typeof info.quality === 'number' ? info.quality.toFixed(3) : '--';
  const retried = info.retried;

  // Timeline
  const tl = document.getElementById('timeline');
  if (tl.querySelector('.empty-state')) tl.innerHTML = '';

  const div = document.createElement('div');
  const ms = t0 ? (Date.now() - t0).toFixed(0) : (isReplay ? 'replay' : '?');
  div.className = 'tml-ev node_done' + (retried ? ' retry' : '');
  div.style.setProperty('--i', tl.children.length);
  div.innerHTML =
    `<span class="tml-time">${ms}ms</span> ` +
    `<span class="tml-node">${node}</span> ` +
    (ok ? `<span class="tml-ok">✓</span>` : `<span class="tml-fail">✗</span>`) +
    ` Q=${quality}` +
    (retried ? ' <span style="color:var(--orange)">[补数]</span>' : '');

  tl.appendChild(div);
  tl.scrollTop = tl.scrollHeight;

  // 任务输出面板：记录该节点真实产出（value 可能是标量 / list[Signal] / dict）
  if (info.value !== undefined) {
    if (!nodeOutputs.hasOwnProperty(node)) nodeOrder.push(node);
    nodeOutputs[node] = info.value;
    renderOutputPanel();
  }

  // Update topology
  if (currentSpec) updateNodeColor(node, ok, retried);
}

function onResult(result) {
  const r = result.result || result;
  document.getElementById('rQuality').textContent = (r.final_quality || 0).toFixed(3);
  document.getElementById('rCost').textContent = '$' + (r.total_cost || 0).toFixed(4);
  document.getElementById('rLatency').textContent = (r.total_latency_ms || 0).toFixed(0) + 'ms';
  document.getElementById('rNodes').textContent = Object.keys(r.components || {}).length;

  // 质量门阈值显示
  const gateEl = document.getElementById('rGate');
  if (gate) {
    gateEl.textContent = (gate.threshold || 0).toFixed(3) + (gate.passed ? ' ✓' : ' ✗');
    gateEl.style.color = gate.passed ? 'var(--teal)' : 'var(--orange)';
  } else {
    gateEl.textContent = '—';
    gateEl.style.color = '';
  }

  // 状态精准区分：成功 / 质量门未通过 / 部分节点失败 / 错误
  const gate = r.quality_gate;
  const failed = (r.failed_nodes || []).join(', ');
  const fq = (r.final_quality || 0).toFixed(3);
  let html, color;
  if (r.success) {
    html = '✓ 执行成功';
    color = 'var(--teal)';
  } else if (gate && !gate.passed) {
    const thr = (gate.threshold || 0).toFixed(3);
    html = `⚠ 完成 · 质量门未通过 (${fq} &lt; ${thr})`
         + (failed ? `<br><span style="font-size:10px;opacity:.75">未达标节点: ${failed}</span>` : '');
    color = 'var(--orange)';
  } else if (failed) {
    html = `⚠ 完成 · 部分节点失败 (${failed})`;
    color = 'var(--orange)';
  } else {
    html = '⚠ 完成 · 未达标';
    color = 'var(--orange)';
  }
  document.getElementById('rStatus').innerHTML = `<span style="color:${color}">${html}</span>`;
  document.getElementById('resultBar').style.opacity = '1';

  document.getElementById('btnRun').disabled = false;
  document.getElementById('btnRunLabel').textContent = '开始';
  setConnStatus('done');
  refreshHistory();
}

// ────────────────────────────────────────────────────
// 📤 任务输出面板
// ────────────────────────────────────────────────────
function isSignalLike(v) {
  return v && typeof v === 'object' && !Array.isArray(v)
    && ('value' in v) && ('quality' in v) && ('ok' in v);
}

// 把任意产出值（标量 / Signal / list[Signal] / dict）渲染成可读文本
function fmtVal(v, depth) {
  depth = depth || 0;
  if (v === null || v === undefined) return '∅ (空)';
  if (depth > 6) return '…(嵌套过深)';
  if (isSignalLike(v)) {
    const q = (typeof v.quality === 'number') ? v.quality.toFixed(3) : '?';
    const inner = fmtVal(v.value, depth + 1);
    return inner + '  ⟨Q=' + q + (v.ok ? '' : ' ✗') + '⟩';
  }
  if (Array.isArray(v)) {
    if (v.length === 0) return '[]';
    return v.map(x => fmtVal(x, depth + 1)).join(' · ');
  }
  if (typeof v === 'object') {
    try {
      return JSON.stringify(v, (k, val) => isSignalLike(val) ? fmtVal(val, depth + 1) : val, 2);
    } catch (e) { return String(v); }
  }
  if (typeof v === 'string' && v.length > 500) return v.slice(0, 500) + '…(已截断)';
  return String(v);
}

function renderOutputPanel() {
  const body = document.getElementById('outputBody');
  if (nodeOrder.length === 0) {
    body.innerHTML = '<div class="empty-state"><div class="icon" style="font-size:32px;">📭</div><div style="font-size:13px;">节点产出将在此显示</div></div>';
    return;
  }
  // 找最终汇流节点（无出边的节点）→ 标记为「最终输出」
  let sink = null;
  if (currentSpec && currentSpec.wires) {
    const hasOut = new Set();
    currentSpec.wires.forEach(([a]) => hasOut.add(a));
    const all = Object.keys(currentSpec.components || {});
    const sinks = all.filter(n => !hasOut.has(n));
    if (sinks.length) sink = sinks[sinks.length - 1];
  }
  let html = '';
  for (const node of nodeOrder) {
    const val = nodeOutputs[node];
    const comp = currentSpec && currentSpec.components ? currentSpec.components[node] : null;
    const type = comp ? comp.type : '';
    const label = comp ? (comp.label || node) : node;
    const isFinal = (node === sink);
    const rendered = fmtVal(val);
    html += '<div class="out-node' + (isFinal ? ' out-final' : '') + '">'
      + '<div class="out-head">'
      + '<span class="out-name">' + esc(label) + '</span>'
      + '<span class="out-type">' + esc(type) + '</span>'
      + (isFinal ? '<span class="out-badge">最终输出</span>' : '')
      + '</div>'
      + '<div class="out-val">' + esc(rendered) + '</div>'
      + '</div>';
  }
  body.innerHTML = html;
  body.scrollTop = body.scrollHeight;
}

function copyOutput() {
  const body = document.getElementById('outputBody');
  const txt = body.innerText || '';
  if (!txt.trim()) return;
  try {
    navigator.clipboard.writeText(txt);
    const btn = document.querySelector('#outputPanel .op-head button');
    if (btn) { const old = btn.textContent; btn.textContent = '已复制'; setTimeout(() => btn.textContent = old, 1200); }
  } catch (e) { /* clipboard 不可用时静默 */ }
}

// ────────────────────────────────────────────────────
// 简易 / 完整 模式切换（新手友好：默认简易，隐藏高级旋钮；功能不受影响）
// ────────────────────────────────────────────────────
function applyMode(simple) {
  if (simple) document.body.classList.add('simple-mode');
  else document.body.classList.remove('simple-mode');
  const btn = document.getElementById('modeToggle');
  if (btn) btn.textContent = '模式: ' + (simple ? '简易' : '完整');
  try { localStorage.setItem('ca_console_mode', simple ? 'simple' : 'full'); } catch (e) {}
}
function toggleMode() {
  applyMode(!document.body.classList.contains('simple-mode'));
}
function initMode() {
  let m = 'simple';  // 默认简易，零门槛
  try { m = localStorage.getItem('ca_console_mode') || 'simple'; } catch (e) {}
  applyMode(m === 'simple');
}

function onError(err) {
  const tl = document.getElementById('timeline');
  if (tl.querySelector('.empty-state')) tl.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'tml-ev gate_fail';
  div.innerHTML = `<span style="color:var(--red)">✗ 错误: ${err}</span>`;
  tl.appendChild(div);

  document.getElementById('btnRun').disabled = false;
  document.getElementById('btnRunLabel').textContent = '重试';
  setConnStatus('error');
}

function setConnStatus(s) {
  const dot = document.getElementById('statusDot');
  const cs = document.getElementById('connStat');
  const mb = document.getElementById('modelBadge');
  if (s === 'running') { dot.style.background = 'var(--blue)'; cs.textContent = '执行中';
    if (mb) mb.classList.add('pulsing'); }
  else if (s === 'done') { dot.style.background = 'var(--teal)'; cs.textContent = '就绪';
    if (mb) mb.classList.remove('pulsing'); }
  else if (s === 'error') { dot.style.background = 'var(--red)'; cs.textContent = '错误';
    if (mb) mb.classList.remove('pulsing'); }
  else { dot.style.background = 'var(--teal)'; cs.textContent = '已连接';
    if (mb) mb.classList.remove('pulsing'); }
}

function refreshModelBadge() {
  const el = document.getElementById('modelBadge');
  if (!el) return;
  fetch('/models/active').then(r => r.json()).then(d => {
    if (d.live) {
      el.className = 'model-badge live';
      el.dataset.live = '1';
      el.textContent = '';
      el.appendChild(document.createTextNode('🧠 当前模型：'));
      const b = document.createElement('b');
      b.textContent = d.provider + ' · ' + d.model;
      el.appendChild(b);
      el.title = '真实推理后端（' + d.base + '）— 你说的话正在被大模型思考';
    } else {
      el.className = 'model-badge sim';
      el.dataset.live = '0';
      el.textContent = '🧪 演示模式（模拟器）';
      el.title = '未检测到 DEEPSEEK_API_KEY，当前为确定性模拟，不调用真实大模型';
    }
  }).catch(() => {
    el.className = 'model-badge sim';
    el.dataset.live = '0';
    el.textContent = '🧪 模型状态未知';
  });
}

// ────────────────────────────────────────────────────
// History rendering
// ────────────────────────────────────────────────────

function renderHistory(items) {
  const list = document.getElementById('historyList');
  if (!items || items.length === 0) {
    list.innerHTML = '<div class="empty-state" style="padding:30px 0;"><div class="icon">📭</div><div style="font-size:13px;">暂无记录</div></div>';
    return;
  }
  list.innerHTML = items.map(item => {
    const sel = item.run_id === currentRunId ? ' selected' : '';
    const sc = item.status === 'done' ? 'done' : item.status === 'running' ? 'running' : 'error';
    const sq = item.result && item.result.final_quality
      ? `Q=${item.result.final_quality.toFixed(2)}` : '';
    return `<div class="history-item${sel}" onclick="loadRun('${item.run_id}')">
      <div class="hi-goal">${esc(item.goal || item.run_id)}</div>
      <div class="hi-meta">
        <span class="hi-status ${sc}">${item.status}</span>
        ${sq ? ' ' + sq : ''}
        ${item.created_at ? ' · ' + item.created_at.slice(0,16) : ''}
      </div>
    </div>`;
  }).join('');
  list.scrollTop = 0;
}

function clearAll() {
  document.getElementById('goalInput').value = '';
  currentRunId = null;
  currentSpec = null;
  resetDisplay();
  document.getElementById('topoSvg').innerHTML =
    '<text x="400" y="200" text-anchor="middle" fill="var(--muted)" font-size="14" opacity="0.5">等待任务提交...</text>';
  document.getElementById('timeline').innerHTML =
    '<div class="empty-state"><div class="icon" style="font-size:36px;">📡</div><div style="font-size:13px;">实时执行事件将在此展示</div></div>';
  document.getElementById('resultBar').style.opacity = '0';
  nodeOutputs = {}; nodeOrder = [];
  document.getElementById('outputBody').innerHTML =
    '<div class="empty-state"><div class="icon" style="font-size:32px;">📭</div><div style="font-size:13px;">节点产出将在此显示</div></div>';
  document.getElementById('btnRun').disabled = false;
  document.getElementById('btnRunLabel').textContent = '开始';
  setConnStatus('ok');
}

// ────────────────────────────────────────────────────
// SVG Topology Renderer
// ────────────────────────────────────────────────────

function renderTopology(spec) {
  if (!spec || !spec.components) return;
  const comps = spec.components;
  const wires = spec.wires || [];
  const svg = document.getElementById('topoSvg');

  // Calculate layout
  const nodes = Object.keys(comps);
  const layerMap = computeLayers(comps, wires);
  const maxLayer = Math.max(1, ...Object.values(layerMap));
  const nodesPerLayer = {};
  for (const [n, l] of Object.entries(layerMap)) {
    nodesPerLayer[l] = (nodesPerLayer[l] || 0) + 1;
  }

  const W = 800, H = 350, padX = 80, padY = 42;
  const lw = (W - padX * 2) / maxLayer;

  // Build node positions
  const pos = {};
  const layerCount = {};
  for (const nid of nodes) {
    const l = layerMap[nid] || 0;
    layerCount[l] = (layerCount[l] || 0) + 1;
    const count = nodesPerLayer[l] || 1;
    const x = padX + l * lw + lw * 0.5;
    const y = padY + (layerCount[l] / (count + 1)) * (H - padY * 2);
    pos[nid] = { x, y };
  }

  // Build SVG
  let html = '';

  // Wires
  for (const [a, b] of wires) {
    if (!pos[a] || !pos[b]) continue;
    const pa = pos[a], pb = pos[b];
    const midX = (pa.x + pb.x) / 2 + 20;
    html += `<path d="M${pa.x},${pa.y} C${midX},${pa.y} ${midX},${pb.y} ${pb.x},${pb.y}" class="topo-wire" id="wire-${a}-${b}"/>`;
  }

  // Nodes
  for (const nid of nodes) {
    const comp = comps[nid];
    const p = pos[nid];
    const t = comp.type || '?';
    const label = comp.label || nid;
    const color = nodeTypeColor(t);
    const r = nodeRadius(t);

    html += `<g class="topo-node" id="tnode-${nid}" transform="translate(${p.x},${p.y})">
      <rect x="${-r}" y="${-r*0.7}" width="${r*2}" height="${r*1.4}" rx="${r*0.3}"
            fill="#1c2230" stroke="${color}" stroke-width="2"/>
      <text class="topo-label" y="1" dy=".35em">${esc(label)}</text>
      <text class="topo-type" y="${r*0.7+12}">${t}</text>
    </g>`;
  }

  svg.innerHTML = html;

  // Store positions and spec for later updates
  svg._pos = pos;
  svg._comps = comps;
  svg._wires = wires;
  svg._layers = layerMap;
}

function updateNodeColor(nid, ok, retried) {
  const svg = document.getElementById('topoSvg');
  const rect = svg.querySelector(`#tnode-${nid} rect`);
  if (!rect) return;

  let fill, stroke;
  if (!ok) {
    fill = '#2d1216'; stroke = 'var(--red)';
  } else if (retried) {
    fill = '#1f2d1a'; stroke = 'var(--orange)';
    rect.setAttribute('stroke-dasharray', '5 3');
  } else {
    fill = '#122d17'; stroke = 'var(--green)';
  }
  rect.setAttribute('fill', fill);
  rect.setAttribute('stroke', stroke);

  // Add check/cross mark
  const g = rect.parentElement;
  let mark = g.querySelector('.topo-badge');
  if (!mark) {
    mark = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    mark.setAttribute('class', 'topo-badge');
    mark.setAttribute('x', rect.getAttribute('width') ? parseFloat(rect.getAttribute('width'))/2 - 8 : '10');
    mark.setAttribute('y', '-4');
    g.appendChild(mark);
  }
  mark.textContent = ok ? '✓' : '✗';
  mark.setAttribute('fill', ok ? 'var(--green)' : 'var(--red)');

  // Animate wire from this node to successors
  if (svg._wires) {
    const wires = svg._wires;
    for (const [a, b] of wires) {
      if (a === nid || b === nid) {
        const w = svg.querySelector(`#wire-${a}-${b}`);
        if (w) w.classList.add('active');
      }
    }
  }
}

function computeLayers(comps, wires) {
  const layers = {};
  const inDegree = {};
  const succ = {};
  for (const n of Object.keys(comps)) { inDegree[n] = 0; succ[n] = []; }
  for (const [a, b] of wires) { succ[a] = succ[a] || []; succ[a].push(b); inDegree[b] = (inDegree[b] || 0) + 1; }

  const queue = [];
  for (const [n, d] of Object.entries(inDegree)) {
    if (d === 0) { queue.push(n); layers[n] = 0; }
  }
  while (queue.length) {
    const u = queue.shift();
    for (const v of (succ[u] || [])) {
      inDegree[v]--;
      if (inDegree[v] === 0) {
        layers[v] = layers[u] + 1;
        queue.push(v);
      }
    }
  }
  return layers;
}

function nodeTypeColor(t) {
  if (t === 'power' || t === 'source') return '#6a737d';
  if (t === 'capacitor') return '#6a737d';
  if (t === 'resistor') return '#58a6ff';
  if (t === 'format_adapter') return '#d29922';
  if (t === 'diode' || t === 'adc') return '#f78166';
  return '#6a737d';
}

function nodeRadius(t) {
  if (t === 'power' || t === 'source') return 22;
  if (t === 'capacitor') return 18;
  if (t === 'resistor') return 28;
  return 24;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ────────────────────────────────────────────────────
// Init
// ────────────────────────────────────────────────────
refreshHistory();
initMode();   // 应用简易/完整模式（默认简易，新手友好；功能不变）
refreshModelBadge();   // 拉取并展示当前模型后端（DeepSeek / 模拟器）
setInterval(refreshHistory, 10000); // auto-refresh history every 10s
