<svg viewBox="0 0 680 420" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<title>circuit 拓扑即共享长时记忆总线</title>
<desc>多个工作记忆有限的 agent 节点挂在同一共享长时记忆总线上，通过写入与检索共享经验。</desc>

<text x="40" y="34" style="font-size:14px;font-weight:500;fill:#2C2C2A">circuit 拓扑 = 共享长时记忆总线</text>

<rect x="90" y="80" width="130" height="66" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="155" y="108" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#04342C">agent ① 检索</text>
<text x="155" y="130" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#085041">工作记忆·窄</text>

<rect x="275" y="80" width="130" height="66" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="108" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#04342C">agent ② 推理</text>
<text x="340" y="130" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#085041">工作记忆·窄</text>

<rect x="460" y="80" width="130" height="66" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="525" y="108" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#04342C">agent ③ 校验</text>
<text x="525" y="130" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#085041">工作记忆·窄</text>

<rect x="60" y="220" width="560" height="76" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="252" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#26215C">共享长时记忆总线</text>
<text x="340" y="278" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#3C3489">topology_memory.json · executions.db · ShareRepo</text>

<line x1="155" y1="146" x2="155" y2="220" stroke="#534AB7" stroke-width="1.2" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
<line x1="340" y1="146" x2="340" y2="220" stroke="#534AB7" stroke-width="1.2" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
<line x1="525" y1="146" x2="525" y2="220" stroke="#534AB7" stroke-width="1.2" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>

<text x="340" y="338" text-anchor="middle" style="font-size:12px;fill:#5F5E5A">每个 agent 上下文有限（节点只持 required_inputs），却共享同一总线</text>
<text x="340" y="360" text-anchor="middle" style="font-size:12px;fill:#5F5E5A">关键不是无限 context，而是高效的共享记忆总线（推论 2）</text>
<text x="340" y="388" text-anchor="middle" style="font-size:12px;fill:#0F6E56">正反馈：节点质量↑ → 总线经验↑ → 下次检索更优</text>
</svg>
